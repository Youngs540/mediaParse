[workspace]
members = [
  "crates/core",
  "crates/infra",
  "crates/app",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
strsim = "0.11"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
walkdir = "2"
ignore = "0.4"
crossbeam-channel = "0.5"
async-trait = "0.1"
futures = "0.3"
toml = "0.8"
dirs = "5"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
